<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>指尖分类 · 甬上洁净</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<!-- 静态预取手势库：入口路径与 app.js 里 CONFIG.mp.bundle 必须一致 -->
<link rel="modulepreload" href="./vendor/mediapipe/vision_bundle.mjs">
</head>
<body>
  <canvas id="stage"></canvas>

  <!-- 左下：标题与朱砂印 -->
  <div id="titleBlock">
    <h1>指尖分类</h1>
  </div>

  <!-- 左上：得分与连击 -->
  <div id="scoreBlock">
    <div class="score-row"><span class="score-k">得分</span><span id="scoreVal" class="score-v">0</span></div>
    <div class="score-row"><span class="score-k">连击</span><span id="comboVal" class="score-v combo">0</span></div>
  </div>

  <!-- 右上：倒计时 -->
  <div id="timerBlock">
    <div id="timeVal">60</div>
    <div id="timeBar"><i id="timeFill"></i></div>
    <div class="timer-label">秒</div>
  </div>

  <!-- 右侧竖排题跋：本局提示 -->
  <aside id="inscription" aria-hidden="true">
    <div class="insc-quote">
      <div id="tipQuote">物各归其位，城自清宁</div>
    </div>
    <div class="insc-name">
      <span class="seal seal-small"><span>净</span></span>
    </div>
  </aside>

  <!-- 右下：只留一个音符，鼠标靠近才露字 -->
  <div id="soundCtl">
    <button id="soundBtn" type="button" aria-label="静音 / 恢复声音" title="静音 / 恢复声音（M）">
      <span id="muteGlyph">♪</span>
      <span class="sound-label">静音 · 恢复声音</span>
    </button>
  </div>

  <!-- 右下：回看小窗，帮助对位 -->
  <div id="camWrap">
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="skel" width="240" height="180"></canvas>
    <div id="handTags">
      <span id="tagRight" class="hand-tag">抓取手</span>
    </div>
  </div>

  <!-- 短暂提示 -->
  <div id="toast" aria-live="polite"></div>

  <!-- 加载诊断：只在出错时出现 -->
  <div id="errDetail" class="hidden" aria-live="polite"></div>

  <!-- 进入页：操作说明只在这里讲一次 -->
  <div id="gate">
    <div class="gate-panel">
      <div class="gate-logo" title="指尖分类"><span>指尖<br>分类</span></div>
      <h2>用一双手，把垃圾送回该去的地方</h2>
      <p class="gate-guide">右手握拳，抓住垃圾；移到对应的桶上方，张开手掌投放。</p>
      <p class="gate-guide gate-guide-alt">无摄像头也能玩：按住鼠标拖动，或用方向键移动、空格键抓放。</p>
      <button id="startBtn" type="button">进 入</button>
      <p class="gate-note">60 秒限时 · 分类正确得分并累积连击 · 分错扣 3 秒</p>
      <p class="gate-note gate-note-sub">M 静音 · C 摄像头 · D 演示模式 · Esc 退出 · R 重开</p>
    </div>
  </div>

  <!-- 结算页 -->
  <div id="over" class="hidden">
    <div class="over-panel">
      <div class="over-overline">本 轮 结 束</div>
      <div class="over-score"><span id="overScore">0</span><em>分</em></div>
      <div class="over-stats">
        <div class="stat"><span class="stat-k">正确</span><span id="overRight" class="stat-v">0</span></div>
        <div class="stat"><span class="stat-k">分错</span><span id="overWrong" class="stat-v">0</span></div>
        <div class="stat"><span class="stat-k">准确率</span><span id="overAcc" class="stat-v">0%</span></div>
        <div class="stat"><span class="stat-k">最高连击</span><span id="overCombo" class="stat-v">0</span></div>
      </div>
      <p id="overBest" class="over-best"></p>
      <p class="over-rule">正确 +10 × 连击倍率（最高 ×5）· 分错 −3 秒</p>
      <button id="againBtn" type="button">再 来 一 局</button>
      <p class="over-note">按 R 也可以重开</p>
    </div>
  </div>

  <!-- 纸色过渡：避免大屏切换露出桌面 -->
  <div id="blackout" aria-hidden="true"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
